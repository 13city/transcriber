[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-transcriber"
version = "0.1.0"
description = "Local-first lecture capture, Faster Whisper transcription, and conservative transcript normalization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "13city"}]
dependencies = [
  "faster-whisper>=1.1.0",
  "transformers>=4.51.0",
  "torch>=2.4.0",
  "accelerate>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
